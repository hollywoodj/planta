<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Planta</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #143326;
        color: #f3eee4;
        font-family: "Figtree", system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        border-radius: 50% 50% 46% 54%;
        border: 2px solid #c4a15a;
        box-shadow: inset 0 0 0 12px rgba(196, 161, 90, 0.18);
        transform: rotate(-12deg);
        margin: 0 auto 18px;
      }
      p {
        margin: 0;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark"></div>
      <p>Opening the leaf clinic…</p>
    </div>
  </body>
</html>
